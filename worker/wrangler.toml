name = "mein-kalender-ki"
main = "ai.js"
compatibility_date = "2026-11-01"
keep_vars = true                                        # im Dashboard gesetzte Werte beim automatischen Bereitstellen nicht löschen

[vars]
SUPABASE_URL = "https://vhwajjbrpibdurlovrrz.supabase.co"      # aus Supabase → Project Settings → API
SUPABASE_ANON_KEY = "sb_publishable_wOU5-8_B56PuRY1vc0xORw_KN06k_45"                     # öffentlicher Schlüssel, darf hier stehen
ALLOWED_ORIGINS = "https://mein-kalender-czb.pages.dev"      # später + eigene Domain, mit Komma getrennt
MODEL_QUICK = "claude-haiku-5-5"                        # günstig: Packlisten, Merklisten, Geschenkideen (0,10/0,50 $ je 1 Mio. Tokens)
MODEL_QUICK_FALLBACK = "claude-haiku-4-5-20251001"      # falls Haiku 5.5 nicht verfügbar ist
MODEL_DEFAULT = "claude-sonnet-5-5"                     # stärker: Dokumente auswerten
# KI-Grenzen pro Nutzer stellst du im Cloudflare-Dashboard ein (Worker → Einstellungen → Variablen und Geheimnisse):
#   DAILY_LIMIT (40), IMAGE_DAILY_LIMIT (10), MONTHLY_LIMIT (400), MONTHLY_TOKENS (3000000), MONTHLY_USD (3, 0 = aus)
#   Fehlt ein Wert, gilt die Zahl in Klammern. Hier bewusst NICHT eintragen – sonst überschreibt jedes Bereitstellen die Werte aus dem Dashboard.
GOOGLE_CLIENT_ID = "15500783020-sv5uce29l3mv4kf82ouen5pt7c8p9qlu.apps.googleusercontent.com"

[triggers]
crons = ["*/5 * * * *"]                               # alle 5 Minuten: fällige Benachrichtigungen verschicken

# Geheime Werte NICHT hier eintragen, sondern:
#   npx wrangler secret put ANTHROPIC_KEY
#   npx wrangler secret put SUPABASE_SERVICE_KEY
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put VAPID_JWK        (Schlüssel für Benachrichtigungen, erzeugt auf /vapid.html)
#   npx wrangler secret put DB_CLIENT_ID     (DB API Marketplace → App → Client ID, für „Züge live“)
#   npx wrangler secret put DB_API_KEY       (DB API Marketplace → App → API Key)
#   npx wrangler secret put ADMIN_EMAIL      (E-Mail des Betreiber-Kontos für das Dashboard, mehrere mit Komma)
